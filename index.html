signup?role:null,signup?nm:null,signup?h("label",{text:"Photo de profil (facultatif)"}):null,signup?ph:null,em,pw,btn,box,
h("button",{class:"btn alt",text:signup?"J’ai déjà un compte":"Créer un compte",onclick:function(){authForm(!signup)}}))}

async function notifs(){
if(!user){authForm(false);return}
var since=new Date(profile?profile.notif_seen_at:0);
var r=await db.from("songs").select("id,title,artist_name,created_at").neq("artist_id",user.id).order("created_at",{ascending:false}).limit(20),ul=h("ul");
(r.data||[]).forEach(function(x){var nw=new Date(x.created_at)>since;ul.appendChild(h("li",{class:"card"},h("a",{href:"?song="+x.id,class:"a",text:(nw?"🆕 ":"")+"Nouvelle chanson de "+x.artist_name+" : "+x.title}),h("div",{class:"st",text:fmt(x.created_at)})))});
view.replaceChildren(h("h1",{text:"Notifications"}),(r.data||[]).length?ul:msg("Rien de nouveau pour le moment."));
await db.rpc("mark_notifs_seen");if(profile)profile.notif_seen_at=new Date().toISOString()}

async function account(){
if(!user){authForm(false);return}
var p=profile||{artist_name:"",referral_code:"",quota_bytes:0,role:"fan"},isA=p.role==="artist";
var a=await Promise.all([db.rpc("my_referral_progress"),db.from("songs").select("size_bytes").eq("artist_id",user.id),db.from("v_artist_stats").select("followers").eq("id",user.id).maybeSingle()]);
var pr=(a[0].data&&a[0].data[0])||{invited:0,valid:0},fol=a[2].data?a[2].data.followers:0;
var used=(a[1].data||[]).reduce(function(s,x){return s+Number(x.size_bytes)},0);
var gb=function(n){return (n/1073741824).toFixed(2)+" Go"},link=location.origin+location.pathname+"?ref="+p.referral_code;
var ph=h("input",{type:"file",accept:"image/*"}),pm=h("div");
var chg=h("button",{class:"btn alt",text:"Changer ma photo",onclick:async function(){if(!ph.files[0]){pm.replaceChildren(msg("Choisis d’abord une photo.",1));return}
try{await setAvatar(ph.files[0],user.id);await loadProfile();route()}catch(e){pm.replaceChildren(msg("Erreur : "+e.message,1))}}});
var out=[h("h1",{},ava(p.avatar_url,p.artist_name,56),p.artist_name||"Mon compte"),h("p",{text:isA?"Compte artiste":"Compte fan"}),ph,chg,pm];
if(isA){out.push(h("p",{text:"Abonnés : "+fol+" · Stockage utilisé : "+gb(used)+" sur "+gb(p.quota_bytes)}),
h("h2",{text:"Parrainage : +1 Go pour chaque 3 artistes invités qui publient une chanson"}),
h("p",{text:"Progression : "+(pr.valid%3)+"/3 (invités : "+pr.invited+", valides : "+pr.valid+")"}),
h("p",{class:"trk",text:link}),
h("a",{class:"btn",href:"https://wa.me/?text="+encodeURIComponent("Rejoins-moi sur Ituri Music, la plateforme musicale de l’Ituri : "+link),target:"_blank",text:"Partager sur WhatsApp"}),
h("h2",{text:"Monétisation"}),h("p",{class:"st",text:"Elle s’activera à partir de 1 000 abonnés ("+fol+"/1000)."+(p.monetization_eligible?" Ton compte est éligible ✓":"")}))}
out.push(h("button",{class:"btn alt",text:"Déconnexion",onclick:function(){db.auth.signOut()}}));
view.replaceChildren.apply(view,out)}

window.addEventListener("hashchange",route);
db.auth.onAuthStateChange(function(ev,s){user=s?s.user:null;profile=null;
setTimeout(async function(){await loadProfile();route()},0)});
